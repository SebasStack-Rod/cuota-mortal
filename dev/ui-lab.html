<!DOCTYPE html>
<!-- dev/ui-lab.html
     Laboratorio para probar suelto: pilas de fichas, bandeja, fichas voladoras, barra superior y todos los sonidos.
     Se abre con el servidor corriendo: http://localhost:8000/dev/ui-lab.html
     El <base> hace que las rutas relativas (assets/..., css/..., js/...) se resuelvan desde la raíz del proyecto. -->
<html lang="es">
<head>
  <base href="../">
  <meta charset="utf-8">
  <title>UI Lab - Cuota Mortal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Monoton&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/hud.css">
  <style>
    html, body { overflow: auto; height: auto; }
    body { padding: 16px; max-width: 430px; margin: 0 auto; }
    h1 { font: 400 22px var(--font-title); color: var(--gold-light); margin: 0 0 12px; }
    h2 { font: 400 16px var(--font-title); color: var(--gold-light); margin: 0 0 10px; }
    section { margin-bottom: 14px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    .row label { font-size: 14px; color: var(--text-dim); }
    .lab-btn { min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--gold-dim); background: transparent; color: var(--text); }
    .lab-btn:active { background: rgba(212, 175, 55, 0.2); }
    .lab-input { min-height: 44px; width: 120px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: #0D0D1A; color: var(--text); }
    .demo { min-height: 90px; display: flex; align-items: flex-end; padding: 8px; background: rgba(245,241,230,.04); border-radius: 10px; }
    .tray-demo { position: relative; height: 80px; }
    .tray-demo .tray { position: absolute; bottom: 0; }
    .hud-demo { position: relative; height: 90px; overflow: hidden; border-radius: 10px; background: var(--bg); }
    .hud-demo .hud { position: absolute; }
    .endpoints { display: flex; justify-content: space-between; margin: 14px 0; }
    .endpoint { width: 64px; height: 64px; border-radius: 50%; border: 2px dashed var(--gold-dim); display: grid; place-items: center; font-size: 12px; color: var(--text-dim); }
    .soundgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  </style>
</head>
<body>
  <h1>UI Lab</h1>
  <p id="lab-audio-state" class="hint" style="margin-bottom:12px">Tocá cualquier botón para desbloquear el audio.</p>

  <section>
    <h2>Pila de fichas</h2>
    <div class="row">
      <label>Monto ($) <input id="stack-amount" class="lab-input" type="number" value="137.5" step="0.25" min="0"></label>
      <label>max <input id="stack-max" class="lab-input" type="number" value="6" min="1" max="12" style="width:70px"></label>
      <label>tamaño <input id="stack-size" class="lab-input" type="number" value="44" min="20" max="80" style="width:70px"></label>
    </div>
    <div class="row" id="stack-presets"></div>
    <div id="stack-demo" class="demo"></div>
  </section>

  <section>
    <h2>Bandeja de fichas</h2>
    <div class="row"><label>Banco ($) <input id="tray-bank" class="lab-input" type="number" value="2000" min="0"></label>
      <span id="tray-selected" class="hint"></span></div>
    <div class="tray-demo"><div id="tray" class="tray" role="listbox" aria-label="Fichas"><div class="tray__scroll"></div></div></div>
  </section>

  <section>
    <h2>Fichas voladoras</h2>
    <div class="row"><label>Monto ($) <input id="fly-amount" class="lab-input" type="number" value="250"></label>
      <label>cantidad <input id="fly-count" class="lab-input" type="number" value="8" style="width:70px"></label></div>
    <div class="endpoints"><div id="fly-a" class="endpoint">A</div><div id="fly-b" class="endpoint">B</div></div>
    <div class="row"><button id="fly-ab" class="lab-btn">A → B</button><button id="fly-ba" class="lab-btn">B → A</button><span id="fly-msg" class="hint"></span></div>
  </section>

  <section>
    <h2>Barra superior</h2>
    <div class="row">
      <button id="hud-up" class="lab-btn">Banco +$150</button><button id="hud-down" class="lab-btn">Banco −$300</button>
      <button id="hud-danger" class="lab-btn">Últimos 20 s sin cubrir</button>
    </div>
    <div class="hud-demo">
      <header id="hud-top" class="hud">
        <div class="hud__bank"><div id="hud-bank-stack" class="hud__stack"></div><div><span class="hud__label">Banco</span><span id="hud-bank" class="hud__bankval">$0</span></div></div>
        <div class="hud__day"><span id="hud-day">Día 1/7</span><span id="hud-timer" class="hud__timer">--:--</span></div>
        <div class="hud__quota"><span class="hud__label">Cuota</span><span id="hud-quota" class="hud__quotaval">$0</span></div>
        <div id="hud-progress" class="hud__progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="hud-fill" class="hud__fill"></div></div>
      </header>
    </div>
    <nav id="hud-bar" class="bar" hidden></nav>
  </section>

  <section>
    <h2>Sonidos</h2>
    <div class="row"><label>Volumen <input id="snd-volume" type="range" min="0" max="100" value="80"></label>
      <label>Velocidad <input id="snd-rate" type="range" min="50" max="200" value="100"></label></div>
    <div id="sounds" class="soundgrid"></div>
    <div class="row" style="margin-top:10px"><span class="hint">Repetidos:</span><div id="loops"></div></div>
  </section>

  <div id="toasts" role="status"></div>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="module" src="dev/ui-lab.js"></script>
</body>
</html>
