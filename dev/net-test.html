<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba de red (Fase 3)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 12px; margin: 0; }
    input, button { font-size: 16px; padding: 8px; margin: 4px 0; }
    button { background: #222; color: #eee; border: 1px solid #555; border-radius: 8px; min-height: 44px; margin-right: 4px; }
    pre { font-size: 12px; white-space: pre-wrap; background: #1b1b1b; padding: 8px; border-radius: 8px; max-height: 260px; overflow: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 15px; }
    td, th { border-bottom: 1px solid #333; padding: 4px 6px; text-align: left; }
    .caja { font-size: 18px; background: #1b1b1b; padding: 10px; border-radius: 10px; margin: 8px 0; line-height: 1.6; }
  </style>
</head>
<body>
  <h2>Prueba de red (Fase 3)</h2>
  <input id="nombre" placeholder="Tu nombre">
  <input id="codigo" placeholder="Código (4 letras)" maxlength="4">
  <div>
    <button id="crear">Crear sala</button>
    <button id="unirse">Unirse</button>
    <button id="salir">Salir</button>
  </div>
  <div>
    <button id="iniciar">Iniciar partida (anfitrión)</button>
    <button id="dia10">Día de 10 s (lobby)</button>
    <button id="revancha">Revancha (anfitrión, al terminar)</button>
  </div>
  <div>
    <button id="sentar">Sentarse en "dummy"</button>
    <button id="parar">Pararse</button>
    <button id="apostar">Apostar $1 a cara</button>
    <button id="cinco">$1 × 5 de golpe</button>
    <button id="apostarBig">Apostar $5.000 a cara</button>
    <button id="banco1">Dejar el banco en $1 (prueba)</button>
    <button id="rank">Ver rankings</button>
  </div>
  <div id="resumen" class="caja">Sin sala</div>
  <div id="rankings" class="caja" style="display:none"></div>
  <div id="guardado" class="caja" style="font-size:14px">Guardado en la base: —</div>
  <h3>Registro</h3>
  <pre id="log"></pre>
  <h3>Estado (RoomState)</h3>
  <pre id="estado">sin sala</pre>

  <script type="module">
    // dev/net-test.html: prueba la sesión con dos pestañas (o un celular). Abrir desde GitHub Pages o un servidor local.
    import { session } from '../js/net/session.js';
    import * as dummy from './dummy-game.js';
    import { fmt } from '../js/core/money.js';

    session.setGameLoader(async () => ({ dummy: { logic: async () => dummy } }));

    const $ = (id) => document.getElementById(id);
    const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const log = (t) => { $('log').textContent = new Date().toLocaleTimeString() + '  ' + t + '\n' + $('log').textContent; };
    const nombre = () => $('nombre').value.trim() || 'Prueba';

    const FASES = { lobby: 'Lobby (esperando)', day: 'Día en curso', collect: 'Cobrando la cuota', shop: 'Tienda (no se puede apostar)', victory: '¡VICTORIA!', gameover: 'GAME OVER' };
    const color = (n) => (n > 0 ? '#2EE59D' : n < 0 ? '#FF4D5E' : '#eee');

    function resumen(s) {
      const quien = (id) => (id && s.players[id] ? esc(s.players[id].name) : '—');
      const filas = Object.values(s.players).map((p) => {
        const st = p.stats;
        return `<tr><td>${p.connected ? '🟢' : '🔴'} ${esc(p.name)}${p.seat ? ' (en ' + esc(p.seat) + ')' : ''}</td>`
          + `<td>${fmt(st.bet)}</td><td style="color:${color(st.net)}">${fmt(st.net)}</td>`
          + `<td>${st.streak > 0 ? '+' : ''}${st.streak}</td><td>${fmt(st.bestWin)}</td><td>${fmt(st.worstLoss)}</td><td>${st.rounds}</td></tr>`;
      }).join('');
      let html = `<b>${FASES[s.phase] || s.phase}</b> · Día ${s.day}/7`;
      if (s.phase === 'shop' && s.shopEndsAt) {
        const falta = Math.max(0, Math.ceil((s.shopEndsAt - session.serverNow()) / 1000));
        html += ` · vuelve el día en <b>${falta} s</b>`;
      }
      if (s.phase === 'day' && s.dayEndsAt) {
        const falta = Math.max(0, Math.ceil((s.dayEndsAt - session.serverNow()) / 1000));
        html += ` · termina en <b>${falta} s</b>`;
      }
      html += `<br><b>Banco común: ${fmt(s.bank)}</b> · Cuota de hoy: ${fmt(s.quota)}<br>`
        + `<table><tr><th>Jugador</th><th>Apostó</th><th>Neto</th><th>Racha</th><th>Mejor</th><th>Peor</th><th>Rondas</th></tr>${filas}</table>`
        + `🏆 Mayor ganador: <b>${quien(s.titles.topWinner)}</b> · 🐑 Oveja negra: <b>${quien(s.titles.blackSheep)}</b>`;
      if (s.collect) html += `<br>Cobro del día: ${fmt(s.collect.amount)} → ${s.collect.paid ? 'PAGADA, queda ' + fmt(s.collect.bankAfter) : 'IMPAGA'}`;
      if (s.summary) {
        const m = s.summary;
        html += `<br>Resumen del día ${m.day}: el banco cambió ${fmt(m.bankDelta)} jugando · ganó más: ${quien(m.topWinner)} · perdió más: ${quien(m.blackSheep)}`;
      }
      return html;
    }

    let ultimoEstado = null;
    let rankingPendiente = false;
    session.on('state', (s) => {
      ultimoEstado = s;
      $('estado').textContent = s ? JSON.stringify(s, null, 2) : 'sin sala';
      $('resumen').innerHTML = s ? resumen(s) : 'Sin sala';
      // Al terminar la partida muestra los rankings solos (la base tarda unos segundos en guardar).
      if (s && (s.phase === 'gameover' || s.phase === 'victory') && !rankingPendiente) {
        rankingPendiente = true;
        setTimeout(() => { rankingPendiente = false; mostrarRankings(); }, 4000);
      }
    });
    // La cuenta regresiva de la tienda y del día se actualiza cada segundo.
    setInterval(() => { if (ultimoEstado) $('resumen').innerHTML = resumen(ultimoEstado); }, 1000);
    // Estado del guardado en Supabase, cada 2 segundos.
    setInterval(() => {
      const h = session.historyStatus();
      $('guardado').textContent = h
        ? `Guardado en la base: ${h.eventosPendientes} eventos esperando · ${h.partidasSinGuardar} partidas sin guardar` + (h.ultimoError ? ' · ERROR: ' + h.ultimoError : ' · sin errores')
        : 'Guardado en la base: — (no sos anfitrión)';
    }, 2000);

    session.on('toast', (t) => log(`[${t.kind}] ${t.text}`));
    session.on('connection', (c) => log('conexión: ' + c));
    session.on('tableEvent', (e) => log(`evento ${e.gameId}/${e.name}: ${JSON.stringify(e.data)}`));

    const AYUDA = {
      solo_anfitrion: 'ese botón es solo para el anfitrión (quien creó la sala)',
      no_sentado: 'primero tocá "Sentarse"',
      sin_fondos: 'el banco no alcanza para esa apuesta',
      juego_inexistente: 'ese juego no está cargado',
    };
    function ayudaFase() {
      const f = session.getState()?.phase;
      if (!f) return 'primero creá o uníte a una sala';
      if (f === 'lobby') return 'la partida todavía no empezó: el anfitrión tiene que tocar "Iniciar partida"';
      if (f === 'day') return 'el día ya está en curso';
      if (f === 'collect') return 'está cobrando la cuota, esperá unos segundos';
      if (f === 'shop') return 'estamos en la TIENDA (60 s): no se puede apostar. Esperá a que diga "Día en curso"';
      return 'la partida terminó: el anfitrión puede tocar "Revancha"';
    }
    async function run(label, fn) {
      try {
        const r = await fn();
        const extra = r && r.ok === false
          ? ' → ' + (r.error === 'no_es_momento' ? ayudaFase() : (AYUDA[r.error] || ''))
          : '';
        log(`${label}: ${r && r.ok === false ? 'ERROR ' + r.error + extra : 'ok'}`);
      } catch (e) {
        log(`${label}: EXCEPCIÓN ${e.code || ''} ${e.message}`);
      }
    }
    const apuesta = (amount, outcome) => session.sendGameAction('dummy', { type: 'bet', side: 'cara', amount, ...(outcome ? { testOutcome: outcome } : {}) });

    async function mostrarRankings() {
      try {
        const r = await session.fetchRankings();
        const filas = (lista) => lista.map((x) => `<tr><td>${esc(x.name)}</td><td style="color:${color(x.net)}">${fmt(x.net)}</td></tr>`).join('') || '<tr><td>—</td><td>—</td></tr>';
        $('rankings').style.display = 'block';
        $('rankings').innerHTML = `<b>Rankings (de todas las partidas)</b>`
          + `<table><tr><th>Top ganadores</th><th>Neto</th></tr>${filas(r.topWinners)}</table>`
          + `<table><tr><th>Ovejas negras</th><th>Neto</th></tr>${filas(r.blackSheep)}</table>`
          + `<table><tr><th>Mejores partidas</th><th>Días</th><th>Banco final</th></tr>`
          + (r.bestRuns.map((b) => `<tr><td>${esc(b.room)}</td><td>${b.days}</td><td>${fmt(b.finalBank)}</td></tr>`).join('') || '<tr><td>—</td><td>—</td><td>—</td></tr>')
          + `</table>`;
        log('rankings actualizados');
      } catch (e) {
        log('rankings: EXCEPCIÓN ' + e.message);
      }
    }

    $('crear').onclick = () => run('crear sala', async () => {
      const r = await session.createRoom(nombre());
      $('codigo').value = r.roomCode;
      log('código de sala: ' + r.roomCode);
    });
    $('unirse').onclick = () => run('unirse', () => session.joinRoom($('codigo').value, nombre()));
    $('salir').onclick = () => run('salir', () => session.leaveRoom());
    $('iniciar').onclick = () => run('iniciar', () => session.startGame());
    $('dia10').onclick = () => run('día de 10 s', () => session.setDayLength(10000));
    $('revancha').onclick = () => run('revancha', () => session.rematch());
    $('sentar').onclick = () => run('sentarse', () => session.sitAt('dummy'));
    $('parar').onclick = () => run('pararse', () => session.standUp());
    $('apostar').onclick = () => run('apostar $1', () => apuesta(100));
    $('cinco').onclick = async () => {
      const rs = await Promise.all([1, 2, 3, 4, 5].map(() => apuesta(100)));
      const oks = rs.filter((r) => r.ok).length;
      const errores = rs.filter((r) => !r.ok).map((r) => r.error);
      log(`5 apuestas de $1 juntas: ${oks} aceptadas${errores.length ? ', rechazadas por ' + [...new Set(errores)].join(' / ') : ''}`);
      if (errores.includes('no_es_momento')) log('→ ' + ayudaFase());
    };
    $('apostarBig').onclick = () => run('apostar $5.000', () => apuesta(500000));
    $('banco1').onclick = () => run('dejar el banco en $1', async () => {
      const b = session.getState()?.bank ?? 0;
      if (b <= 100) return { ok: false, error: 'sin_fondos' };
      return apuesta(b - 100, 'lose');   // pierde a propósito (solo el juego de prueba lo permite)
    });
    $('rank').onclick = () => mostrarRankings();
  </script>
</body>
</html>
